<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পরীক্ষা সিস্টেম</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #6C4FF6;
    --primary-dark: #5638E0;
    --accent: #FFB800;
    --paper: #F7F5FF;
    --card: #FFFFFF;
    --ink: #2B2650;
    --muted: #837FA3;
    --good: #17A673;
    --good-bg: #E4F9EF;
    --bad: #FF5C5C;
    --bad-bg: #FFEBEB;
    --border: #E7E1FA;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 24px 16px 60px;
    line-height: 1.6;
    font-feature-settings: "liga" 0, "clig" 0, "calt" 0;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  h1 {
    font-family: 'Baloo Da 2', 'Noto Sans Bengali', sans-serif;
    font-size: 30px; font-weight: 700;
    margin: 0 0 2px; color: var(--primary-dark);
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; font-weight: 500; }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; background: var(--card); padding: 6px; border-radius: 16px; box-shadow: 0 2px 10px rgba(108,79,246,0.08); }
  .tab-btn {
    flex: 1; padding: 11px 12px; border: none; border-radius: 12px;
    background: transparent; cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 700;
    color: var(--muted); transition: all 0.15s;
  }
  .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(108,79,246,0.35); }

  .subtabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .subtab-btn {
    flex: 1; min-width: 100px; padding: 9px 10px; border: 2px solid var(--border);
    border-radius: 20px; background: var(--card); cursor: pointer; font-size: 13px;
    font-family: inherit; font-weight: 700; color: var(--primary-dark);
  }
  .subtab-btn.active { background: var(--accent); border-color: var(--accent); color: #4A3300; }

  .card {
    background: var(--card); border: none; border-radius: var(--radius);
    padding: 22px; margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(108,79,246,0.10);
  }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.2px; }
  input[type=text], input[type=number], input[type=password], input[type=tel], input[type=datetime-local], textarea, select {
    width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px;
    font-size: 15px; font-family: inherit; margin-bottom: 14px; background: var(--paper);
    color: var(--ink); transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--primary);
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    background: var(--primary); color: #fff; border: none; border-radius: 14px;
    padding: 12px 20px; font-size: 15px; font-family: inherit; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(108,79,246,0.30);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(108,79,246,0.38); }
  button:active { transform: translateY(0); }
  button.secondary { background: var(--card); color: var(--primary); border: 2px solid var(--primary); box-shadow: none; }
  button.danger { background: var(--card); color: var(--bad); border: 2px solid var(--bad); box-shadow: none; }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .exam-card {
    border: none; border-radius: 16px;
    background: var(--card);
    padding: 16px 18px; margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(108,79,246,0.08);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    border-left: 6px solid var(--accent);
  }
  .exam-card .info { flex: 1; min-width: 0; }
  .exam-card .name { font-weight: 700; margin-bottom: 3px; font-size: 15.5px; color: var(--primary-dark); }
  .exam-card .meta { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .exam-card .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .exam-card .actions button { padding: 7px 12px; font-size: 13px; }

  .copy-toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; font-weight: 700; z-index: 50; opacity: 0; transition: opacity 0.2s;
    pointer-events: none; box-shadow: 0 4px 14px rgba(108,79,246,0.4);
  }
  .copy-toast.show { opacity: 1; }

  .q-item {
    border: none; border-radius: 16px; padding: 16px;
    margin-bottom: 12px; background: var(--card); box-shadow: 0 3px 12px rgba(108,79,246,0.08);
  }
  .q-item .q-text { font-weight: 700; margin-bottom: 8px; color: var(--ink); }
  .q-item .opt { font-size: 14px; color: var(--muted); padding: 3px 0; font-weight: 500; }
  .q-item .opt.correct { color: var(--good); font-weight: 700; }
  .q-item-actions { margin-top: 10px; display: flex; gap: 8px; }
  .q-item-actions button { padding: 6px 12px; font-size: 13px; }

  .option-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .option-row input[type=text] { margin-bottom: 0; flex: 1; }
  .option-row input[type=radio] { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--primary); }

  .exam-q { margin-bottom: 22px; padding-left: 44px; position: relative; }
  .exam-q .qn {
    position: absolute; left: 0; top: -3px;
    font-weight: 800; font-size: 14px;
    color: #fff; background: var(--primary);
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(108,79,246,0.35);
  }
  .exam-q .qtext { font-weight: 700; font-size: 16px; margin-bottom: 10px; padding-top: 4px; color: var(--ink); }
  .choice {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 2px solid var(--border); border-radius: 14px; margin-bottom: 8px; cursor: pointer;
    background: var(--card); transition: border-color 0.15s, background 0.15s;
  }
  .choice input { width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--primary); }
  .choice.selected { border-color: var(--primary); background: #F0EBFF; }

  .result-item {
    border: none; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px; background: var(--card);
    box-shadow: 0 3px 10px rgba(108,79,246,0.07);
    border-left: 6px solid var(--border);
  }
  .result-item.correct { border-left-color: var(--good); background: var(--good-bg); }
  .result-item.wrong { border-left-color: var(--bad); background: var(--bad-bg); }
  .result-item .tag {
    font-size: 12.5px; font-weight: 800; margin-bottom: 4px; letter-spacing: 0.2px;
  }
  .result-item.correct .tag { color: var(--good); }
  .result-item.wrong .tag { color: var(--bad); }
  .result-item .exp { font-size: 14px; color: var(--ink); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-weight: 500; font-feature-settings: "liga" 0, "clig" 0; text-align: left; word-spacing: normal; }

  .score-box {
    text-align: center; padding: 32px 20px;
    background: linear-gradient(135deg, var(--primary), #9B7CFF);
    color: #fff;
    border-radius: 24px; margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(108,79,246,0.35);
  }
  .score-box .num {
    font-family: 'Noto Sans Bengali', 'Hind Siliguri', system-ui, sans-serif; font-size: 48px; font-weight: 800; line-height: 1;
  }
  .score-box .lbl { font-size: 14px; color: #EAE3FF; margin-top: 8px; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--border); }
  th {
    color: var(--primary-dark); font-weight: 800; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  td { font-size: 14px; font-weight: 500; font-family: 'Noto Sans Bengali', 'Hind Siliguri', system-ui, sans-serif; }

  .empty { text-align: center; color: var(--muted); padding: 34px 10px; font-size: 14px; font-weight: 500; }
  .err { color: var(--bad); font-size: 13px; margin: -8px 0 12px; font-weight: 700; }
  .hint { font-size: 13px; color: var(--muted); margin-top: -8px; margin-bottom: 14px; font-feature-settings: "liga" 0, "clig" 0; text-align: left; word-spacing: normal; }

  .timer {
    position: sticky; top: 8px; z-index: 5; text-align: center; font-weight: 800;
    background: var(--accent); color: #4A3300; padding: 10px 14px; border-radius: 16px;
    margin-bottom: 16px; font-size: 15px;
    box-shadow: 0 4px 14px rgba(255,184,0,0.35);
  }
  .timer.low { background: var(--bad); color: #fff; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .toolbar h2 { font-size: 16px; font-weight: 800; margin: 0; color: var(--primary-dark); }
  .badge {
    display: inline-block; background: var(--accent); color: #4A3300; font-size: 11.5px;
    padding: 3px 10px; border-radius: 20px; margin-left: 6px; font-weight: 700;
  }
  .back-link {
    background: none; color: var(--primary); border: none; padding: 0; font-size: 14px;
    cursor: pointer; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 4px;
    font-weight: 700;
  }
  .back-link:hover { opacity: 0.7; }
  .loading { text-align: center; color: var(--muted); padding: 40px 10px; }

  .lb-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 8px;
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    width: 26px; height: 26px; border-radius: 50%; background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12px; color: var(--primary-dark); flex-shrink: 0;
  }
  .lb-name { flex: 1; font-weight: 600; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-weight: 700; color: var(--muted); font-size: 13px; flex-shrink: 0; }
  .lb-row.lb-me {
    background: #F0EBFF; border-radius: 10px; margin: 0 -8px; padding: 10px 16px;
  }
  .lb-row.lb-me .lb-rank { background: var(--primary); color: #fff; }
  .lb-row.lb-me .lb-name, .lb-row.lb-me .lb-score { color: var(--primary-dark); }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 পরীক্ষার খাতা</h1>
  <p class="sub" id="subtitle">লোড হচ্ছে...</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="student" id="mainTabStudent">শিক্ষার্থী</button>
    <button class="tab-btn" data-tab="teacher" id="mainTabTeacher">শিক্ষক</button>
  </div>

  <div id="content"><div class="loading">লোড হচ্ছে...</div></div>
</div>

<script>
// ============ SUPABASE কনফিগারেশন ============
// এই দুইটা মান আপনার Supabase প্রজেক্টের — এখানে বসানো আছে
const SUPABASE_URL = 'https://dnbajrnkhiikbufbhckn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_s38H81BA_-Yc9eFPcPkZpw_7-BOe6Df';
const TEACHER_PASSWORD = 'teacher123'; // চাইলে এখানে বদলান

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  tab: 'student',
  exams: [],      // [{id, title, duration_min, questions: [{id, text, explanation, correct_index, options:[{id,option_text,option_order}]}]}]
  results: [],
  authed: false,
  loading: true,

  studentView: 'list',
  activeExamId: null,
  lockedExamId: null,
  studentName: '',
  studentPhone: '',
  historyStudentName: null,
  answers: {},
  lastResult: null,
  timerInterval: null,
  timeLeftSec: null,

  teacherView: 'exams',
  teacherExamId: null,
  editingTimerFor: null,
  editingWindowFor: null,
  editingQuestionId: null,
  editingOptions: [{text:'', correct:true}, {text:'', correct:false}]
};

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function escMultiline(s) {
  return esc(s).replace(/\n/g, '<br>');
}

const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBnNumeral(n) {
  return String(n).split('').map(ch => (ch >= '0' && ch <= '9') ? bnDigits[ch] : ch).join('');
}
const bnMonths = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function formatBnDateTime(date) {
  const day = toBnNumeral(date.getDate());
  const month = bnMonths[date.getMonth()];
  let hours = date.getHours();
  const minutes = String(date.getMinutes()).padStart(2, '0');
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  if (hours === 0) hours = 12;
  const timeStr = toBnNumeral(hours) + ' . ' + toBnNumeral(minutes) + ' ' + ampm;
  return `${day} ${month} — ${timeStr}`;
}
function getExam(id) {
  return state.exams.find(e => e.id === id);
}

// ============ ডেটা লোড করা (Supabase থেকে) ============

async function loadAll() {
  state.loading = true;
  render();
  try {
    const { data: exams, error: examErr } = await sb
      .from('exams')
      .select('*')
      .order('created_at', { ascending: false });
    if (examErr) throw examErr;

    const { data: questions, error: qErr } = await sb
      .from('questions')
      .select('*')
      .order('created_at', { ascending: true });
    if (qErr) throw qErr;

    const { data: options, error: oErr } = await sb
      .from('options')
      .select('*')
      .order('option_order', { ascending: true });
    if (oErr) throw oErr;

    const { data: results, error: rErr } = await sb
      .from('results')
      .select('*')
      .order('submitted_at', { ascending: false });
    if (rErr) throw rErr;

    // প্রশ্নের সাথে অপশন জোড়া লাগানো
    const questionsWithOptions = questions.map(q => ({
      id: q.id,
      text: q.text,
      explanation: q.explanation,
      correctIndex: q.correct_index,
      options: options.filter(o => o.question_id === q.id).map(o => o.option_text)
    }));

    // পরীক্ষার সাথে প্রশ্ন জোড়া লাগানো
    state.exams = exams.map(ex => ({
      id: ex.id,
      title: ex.title,
      subject: ex.subject,
      topic: ex.topic,
      durationMin: ex.duration_min,
      startsAt: ex.starts_at,
      endsAt: ex.ends_at,
      questions: questionsWithOptions.filter(q => {
        const orig = questions.find(qq => qq.id === q.id);
        return orig.exam_id === ex.id;
      })
    }));

    state.results = results.map(r => ({
      id: r.id,
      examId: r.exam_id,
      studentName: r.student_name,
      studentPhone: r.student_phone,
      score: r.score,
      total: r.total,
      answers: r.answers,
      submittedAt: r.submitted_at
    }));

  } catch (err) {
    console.error('ডেটা লোড করতে সমস্যা:', err);
    document.getElementById('content').innerHTML =
      `<div class="card"><div class="empty">ডেটা লোড করতে সমস্যা হয়েছে। ইন্টারনেট সংযোগ চেক করুন অথবা পেজ রিফ্রেশ করুন।<br><br><span style="font-size:12px">${esc(err.message || '')}</span></div></div>`;
    state.loading = false;
    return;
  }
  state.loading = false;
  render();
}

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  render();
}

function render() {
  if (state.loading) return;
  const c = document.getElementById('content');
  document.getElementById('subtitle').textContent =
    state.tab === 'student' ? 'পরীক্ষা বেছে নিন এবং অংশ নিন' : 'পরীক্ষা তৈরি করুন ও রেজাল্ট দেখুন';

  if (state.tab === 'teacher') {
    c.innerHTML = renderTeacher();
    bindTeacherEvents();
  } else {
    c.innerHTML = renderStudent();
    bindStudentEvents();
  }
}

// ================= TEACHER =================

function renderTeacher() {
  if (!state.authed) return renderLogin();

  let html = '<div class="subtabs">';
  html += `<button class="subtab-btn ${state.teacherView==='exams'?'active':''}" data-view="exams">পরীক্ষাসমূহ (${state.exams.length})</button>`;
  html += `<button class="subtab-btn ${state.teacherView==='addExam'?'active':''}" data-view="addExam">নতুন পরীক্ষা</button>`;
  html += `<button class="subtab-btn ${state.teacherView==='results'?'active':''}" data-view="results">সব রেজাল্ট (${state.results.length})</button>`;
  html += '</div>';

  if (state.teacherView === 'addExam') html += renderAddExam();
  else if (state.teacherView === 'examDetail') html += renderExamDetail();
  else if (state.teacherView === 'addQuestion') html += renderAddQuestion();
  else if (state.teacherView === 'results') html += renderTeacherResults();
  else html += renderExamList();

  return html;
}

function renderLogin() {
  return `<div class="card">
    <label>শিক্ষক পাসওয়ার্ড দিন</label>
    <input type="password" id="teacherPass" placeholder="পাসওয়ার্ড">
    <div id="loginErr" class="err" style="display:none"></div>
    <button data-action="teacher-login">প্রবেশ করুন</button>
  </div>`;
}

function renderExamList() {
  if (state.exams.length === 0) {
    return '<div class="card"><div class="empty">এখনো কোনো পরীক্ষা তৈরি করা হয়নি।<br>"নতুন পরীক্ষা" ট্যাবে গিয়ে শুরু করুন।</div></div>';
  }
  let html = '';
  state.exams.forEach(ex => {
    const count = ex.questions.length;
    const attempts = state.results.filter(r => r.examId === ex.id).length;
    const windowStr = (ex.startsAt || ex.endsAt)
      ? ' · ⏰ ' + (ex.startsAt ? formatBnDateTime(new Date(ex.startsAt)) : 'যেকোনো সময়') + ' থেকে ' + (ex.endsAt ? formatBnDateTime(new Date(ex.endsAt)) : 'অসীম')
      : '';
    html += `<div class="exam-card">
      <div class="info">
        <div class="name">${esc(ex.title)}</div>
        <div class="meta">${count}টি প্রশ্ন${ex.durationMin ? ' · ' + ex.durationMin + ' মিনিট' : ' · সময়সীমা নেই'} · ${attempts}টি জমা${windowStr}</div>
      </div>
      <div class="actions">
        <button class="secondary" data-action="copy-link" data-id="${ex.id}">লিংক কপি</button>
        <button class="secondary" data-action="open-exam" data-id="${ex.id}">দেখুন</button>
        <button class="danger" data-action="delete-exam" data-id="${ex.id}">মুছুন</button>
      </div>
    </div>`;
  });
  return html;
}

function renderAddExam() {
  return `<div class="card">
    <label>পরীক্ষার নাম</label>
    <input type="text" id="newExamTitle" placeholder="যেমন: সাধারণ জ্ঞান - সেট ১">
    <label>সাবজেক্ট (ঐচ্ছিক)</label>
    <input type="text" id="newExamSubject" placeholder="যেমন: গণিত">
    <label>টপিক (ঐচ্ছিক)</label>
    <input type="text" id="newExamTopic" placeholder="যেমন: শতকরা">

function renderExamDetail() {
  const ex = getExam(state.teacherExamId);
  if (!ex) return '<div class="card"><div class="empty">পরীক্ষাটি পাওয়া যায়নি।</div></div>';

  let html = `<button class="back-link" data-action="back-to-exams">← সব পরীক্ষায় ফিরুন</button>`;
  html += `<div class="toolbar">
    <h2>${esc(ex.title)} <span class="badge">${ex.questions.length}টি প্রশ্ন</span></h2>

  </div>`;

  html += `<div class="card" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
    <div>⏱️ <b>টাইমার:</b> ${ex.durationMin ? toBnNumeral(ex.durationMin) + ' মিনিট' : 'সেট করা নেই'}</div>
    <button class="secondary" data-action="edit-timer" data-id="${ex.id}">টাইমার পরিবর্তন করুন</button>
  </div>`;

  if (state.editingTimerFor === ex.id) {
    html += `<div class="card" style="margin-bottom:16px;">
      <label>নতুন সময়সীমা (মিনিট, খালি রাখলে টাইমার বাদ যাবে)</label>
      <input type="number" id="editTimerInput" placeholder="যেমন: 15" min="1" value="${ex.durationMin || ''}">
      <div id="timerErr" class="err" style="display:none"></div>
      <div style="display:flex; gap:8px;">
        <button data-action="save-timer" data-id="${ex.id}">সেভ করুন</button>
        <button class="secondary" data-action="cancel-edit-timer">বাতিল</button>
      </div>
    </div>`;
  }

  const parts = [];
  if (ex.startsAt) parts.push('শুরু: ' + formatBnDateTime(new Date(ex.startsAt)));
  if (ex.endsAt) parts.push('শেষ: ' + formatBnDateTime(new Date(ex.endsAt)));
  const windowLabel = parts.length > 0 ? parts.join(' · ') : 'সেট করা নেই (যেকোনো সময় দেওয়া যাবে)';

  html += `<div class="card" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
    <div>⏰ <b>সময়সীমা:</b> ${windowLabel}</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="secondary" data-action="edit-window" data-id="${ex.id}">${parts.length > 0 ? 'সময়সীমা পরিবর্তন করুন' : 'সময়সীমা যোগ করুন'}</button>
      ${parts.length > 0 ? `<button class="secondary" data-action="clear-exam-window" data-id="${ex.id}">তুলে দিন</button>` : ''}
    </div>
  </div>`;

  if (state.editingWindowFor === ex.id) {
    const startVal = ex.startsAt ? new Date(ex.startsAt).toISOString().slice(0, 16) : '';
    const endVal = ex.endsAt ? new Date(ex.endsAt).toISOString().slice(0, 16) : '';
    html += `<div class="card" style="margin-bottom:16px;">
      <label>পরীক্ষা শুরু হবে (ঐচ্ছিক — খালি রাখলে যেকোনো সময় থেকে দেওয়া যাবে)</label>
      <input type="datetime-local" id="editWindowStart" value="${startVal}">
      <label>পরীক্ষা শেষ হবে (ঐচ্ছিক)</label>
      <input type="datetime-local" id="editWindowEnd" value="${endVal}">
      <div id="windowErr" class="err" style="display:none"></div>
      <div style="display:flex; gap:8px;">
        <button data-action="save-window" data-id="${ex.id}">সেভ করুন</button>
        <button class="secondary" data-action="cancel-edit-window">বাতিল</button>
      </div>
    </div>`;
  }

  if (ex.questions.length === 0) {
    html += '<div class="card"><div class="empty">এই পরীক্ষায় এখনো কোনো প্রশ্ন নেই।</div></div>';
  } else {
    ex.questions.forEach((q, i) => {
      html += `<div class="q-item">
        <div class="q-text">${i+1}. ${esc(q.text)}</div>`;
      q.options.forEach((o, oi) => {
        html += `<div class="opt ${oi === q.correctIndex ? 'correct' : ''}">${oi === q.correctIndex ? '✓ ' : '&nbsp;&nbsp;'}${esc(o)}</div>`;
      });
      if (q.explanation) {
        html += `<div class="hint" style="margin-top:8px">ব্যাখ্যা: ${escMultiline(q.explanation)}</div>`;
      }
      html += `<div class="q-item-actions">
        <button class="secondary" data-action="edit-question" data-id="${q.id}">এডিট করুন</button>
        <button class="danger" data-action="delete-question" data-id="${q.id}">মুছে ফেলুন</button>
      </div></div>`;
    });
  }
  return html;
}

function renderTeacherResults() {
  if (state.results.length === 0) {
    return '<div class="card"><div class="empty">এখনো কেউ পরীক্ষা দেয়নি।</div></div>';
  }
  let html = `<div class="toolbar">
    <h2>মোট ${state.results.length}টি জমা</h2>
    <button class="secondary" data-action="export-pdf">PDF ডাউনলোড করুন</button>
  </div>`;

  let rows = '';
  state.results.forEach(r => {
    const ex = getExam(r.examId);
    const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
    const date = new Date(r.submittedAt);
    const dateStr = formatBnDateTime(date);
    rows += `<tr>
      <td>${esc(r.studentName)}</td>
      <td>${esc(r.studentPhone || '—')}</td>
      <td>${esc(ex ? ex.title : 'মুছে ফেলা পরীক্ষা')}</td>
      <td>${r.score} / ${r.total}</td>
      <td>${pct}%</td>
      <td>${dateStr}</td>
    </tr>`;
  });
  html += `<div class="card">
    <table>
      <tr><th>নাম</th><th>মোবাইল</th><th>পরীক্ষা</th><th>স্কোর</th><th>শতাংশ</th><th>সময়</th></tr>
      ${rows}
    </table>
  </div>`;
  return html;
}

function bindTeacherEvents() {
  const container = document.getElementById('content');

  const loginBtn = container.querySelector('[data-action="teacher-login"]');
  if (loginBtn) {
    loginBtn.addEventListener('click', doTeacherLogin);
    const passInput = container.querySelector('#teacherPass');
    if (passInput) passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doTeacherLogin(); });
  }

  container.querySelectorAll('.subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => setTeacherView(btn.dataset.view));
  });

  container.querySelectorAll('[data-action="open-exam"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.teacherExamId = btn.dataset.id;
      state.teacherView = 'examDetail';
      render();
    });
  });

  container.querySelectorAll('[data-action="delete-exam"]').forEach(btn => {
    btn.addEventListener('click', () => deleteExam(btn.dataset.id));
  });

  container.querySelectorAll('[data-action="clear-exam-window"]').forEach(btn => {
    btn.addEventListener('click', () => clearExamWindow(btn.dataset.id));
  });

  container.querySelectorAll('[data-action="edit-window"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.editingWindowFor = btn.dataset.id;
      render();
    });
  });

  const cancelWindowBtn = container.querySelector('[data-action="cancel-edit-window"]');
  if (cancelWindowBtn) cancelWindowBtn.addEventListener('click', () => {
    state.editingWindowFor = null;
    render();
  });

  container.querySelectorAll('[data-action="save-window"]').forEach(btn => {
    btn.addEventListener('click', () => saveExamWindow(btn.dataset.id));
  });

  container.querySelectorAll('[data-action="edit-timer"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.editingTimerFor = btn.dataset.id;
      render();
    });
  });

  const cancelTimerBtn = container.querySelector('[data-action="cancel-edit-timer"]');
  if (cancelTimerBtn) cancelTimerBtn.addEventListener('click', () => {
    state.editingTimerFor = null;
    render();
  });

  container.querySelectorAll('[data-action="save-timer"]').forEach(btn => {
    btn.addEventListener('click', () => saveTimer(btn.dataset.id));
  });

  container.querySelectorAll('[data-action="copy-link"]').forEach(btn => {
    btn.addEventListener('click', () => copyExamLink(btn.dataset.id));
  });

  const createExamBtn = container.querySelector('[data-action="create-exam"]');
  if (createExamBtn) createExamBtn.addEventListener('click', createExam);

  const backToExams = container.querySelector('[data-action="back-to-exams"]');
  if (backToExams) backToExams.addEventListener('click', () => { state.teacherView = 'exams'; render(); });

  const backToDetail = container.querySelector('[data-action="back-to-detail"]');
  if (backToDetail) backToDetail.addEventListener('click', () => { state.teacherView = 'examDetail'; render(); });

  const addQTo = container.querySelector('[data-action="add-question-to"]');
  if (addQTo) addQTo.addEventListener('click', () => {
    state.editingOptions = [{text:'', correct:true}, {text:'', correct:false}];
    state.editingQuestionId = null;
    state.teacherView = 'addQuestion';
    render();
  });

  container.querySelectorAll('[data-action="edit-question"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ex = getExam(state.teacherExamId);
      const q = ex ? ex.questions.find(qq => qq.id === btn.dataset.id) : null;
      if (!q) return;
      state.editingOptions = q.options.map((text, i) => ({ text, correct: i === q.correctIndex }));
      state.editingQuestionId = q.id;
      state.teacherView = 'addQuestion';
      render();
    });
  });

  container.querySelectorAll('[data-action="delete-question"]').forEach(btn => {
    btn.addEventListener('click', () => deleteQuestion(btn.dataset.id));
  });

  container.querySelectorAll('[data-action="set-correct"]').forEach(el => {
    el.addEventListener('change', () => setCorrectOption(parseInt(el.dataset.index, 10)));
  });
  container.querySelectorAll('[data-action="option-text"]').forEach(el => {
    el.addEventListener('input', () => updateOptionText(parseInt(el.dataset.index, 10), el.value));
  });
  container.querySelectorAll('[data-action="remove-option"]').forEach(btn => {
    btn.addEventListener('click', () => removeOption(parseInt(btn.dataset.index, 10)));
  });
  const addOptBtn = container.querySelector('[data-action="add-option"]');
  if (addOptBtn) addOptBtn.addEventListener('click', addOption);

  const submitQBtn = container.querySelector('[data-action="submit-question"]');
  if (submitQBtn) submitQBtn.addEventListener('click', submitQuestion);

  const cancelEditQBtn = container.querySelector('[data-action="cancel-edit-question"]');
  if (cancelEditQBtn) cancelEditQBtn.addEventListener('click', () => {
    state.editingQuestionId = null;
    state.teacherView = 'examDetail';
    render();
  });

  const exportBtn = container.querySelector('[data-action="export-pdf"]');
  if (exportBtn) exportBtn.addEventListener('click', exportResultsPdf);
}

function doTeacherLogin() {
  const passInput = document.getElementById('teacherPass');
  const errEl = document.getElementById('loginErr');
  if (passInput.value === TEACHER_PASSWORD) {
    state.authed = true;
    state.teacherView = 'exams';
    render();
  } else {
    errEl.textContent = 'পাসওয়ার্ড ভুল হয়েছে।';
    errEl.style.display = 'block';
  }
}

function setTeacherView(v) {
  state.teacherView = v;
  render();
}

async function createExam() {
  const title = document.getElementById('newExamTitle').value.trim();
  const subject = document.getElementById('newExamSubject').value.trim();
  const topic = document.getElementById('newExamTopic').value.trim();
  const durationRaw = document.getElementById('newExamDuration').value.trim();
  const startRaw = document.getElementById('newExamStart').value;
  const endRaw = document.getElementById('newExamEnd').value;
  const errEl = document.getElementById('examErr2');

  if (!title) {
    errEl.textContent = 'পরীক্ষার নাম লিখুন।';
    errEl.style.display = 'block';
    return;
  }
  const durationMin = durationRaw ? parseInt(durationRaw, 10) : null;
  if (durationRaw && (isNaN(durationMin) || durationMin <= 0)) {
    errEl.textContent = 'সময়সীমা একটি সঠিক সংখ্যা হতে হবে।';
    errEl.style.display = 'block';
    return;
  }
  const startsAt = startRaw ? new Date(startRaw).toISOString() : null;
  const endsAt = endRaw ? new Date(endRaw).toISOString() : null;
  if (startsAt && endsAt && new Date(endsAt) <= new Date(startsAt)) {
    errEl.textContent = 'শেষ সময় অবশ্যই শুরুর সময়ের পরে হতে হবে।';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const { data, error } = await sb
    .from('exams')
    .insert({ title, subject: subject || null, topic: topic || null, duration_min: durationMin, starts_at: startsAt, ends_at: endsAt })
    .select()
    .single();

  if (error) {
    errEl.textContent = 'পরীক্ষা তৈরি করতে সমস্যা হয়েছে: ' + error.message;
    errEl.style.display = 'block';
    return;
  }

  await loadAll();
  state.teacherExamId = data.id;
  state.teacherView = 'examDetail';
  render();
}

async function deleteExam(id) {
  if (!confirm('এই পরীক্ষাটি ও এর সব প্রশ্ন মুছে ফেলা হবে। নিশ্চিত?')) return;
  const { error } = await sb.from('exams').delete().eq('id', id);
  if (error) { alert('মুছতে সমস্যা হয়েছে: ' + error.message); return; }
  await loadAll();
  render();
}

async function clearExamWindow(id) {
  if (!confirm('এই পরীক্ষার সময়সীমা তুলে দেওয়া হবে, এখন থেকে যেকোনো সময় সবাই এটা দিতে পারবে। নিশ্চিত?')) return;
  const { error } = await sb

}

async function saveExamWindow(id) {

  const endRaw = document.getElementById('editWindowEnd').value;

    errEl.style.display = 'block';
    return;
  }

  const { error } = await sb
    .from('exams')
    .update({ starts_at: startsAt, ends_at: endsAt })
    .eq('id', id);

  if (error) {
    errEl.textContent = 'সেভ করতে সমস্যা হয়েছে: ' + error.message;
    errEl.style.display = 'block';
    return;
  }

  state.editingWindowFor = null;

async function saveTimer(id) {

      errEl.style.display = 'block';
      return;
    }
  }

  const { error } = await sb
    .from('exams')
    .update({ duration_min: durationMin })
    .eq('id', id);

  if (error) {
    errEl.textContent = 'সেভ করতে সমস্যা হয়েছে: ' + error.message;
    errEl.style.display = 'block';
    return;
  }

  state.editingTimerFor = null;
  await loadAll();

}

function copyExamLink(id) {
  const url = `${window.location.origin}${window.location.pathname}?exam=${id}`;
  const showToast = () => {
    const toast = document.createElement('div');
    toast.className = 'copy-toast show';
    toast.textContent = 'লিংক কপি হয়েছে!';
    document.body.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(showToast).catch(() => {
      prompt('লিংকটি কপি করুন:', url);
    });
  } else {
    prompt('লিংকটি কপি করুন:', url);
  }
}

function addOption() {
  state.editingOptions.push({text:'', correct:false});
  render();
}
function removeOption(i) {
  state.editingOptions.splice(i, 1);
  if (!state.editingOptions.some(o => o.correct)) state.editingOptions[0].correct = true;
  render();
}
function setCorrectOption(i) {
  state.editingOptions.forEach((o, oi) => o.correct = (oi === i));
}
function updateOptionText(i, val) {
  state.editingOptions[i].text = val;
}

async function submitQuestion() {
  const ex = getExam(state.teacherExamId);
  if (!ex) return;

  const text = document.getElementById('newQText').value.trim();
  const exp = document.getElementById('newQExp').value.trim();
  const errEl = document.getElementById('qErr');
  const opts = state.editingOptions.map(o => o.text.trim());

  if (!text) {
    errEl.textContent = 'প্রশ্ন লিখুন।';
    errEl.style.display = 'block';
    return;
  }
  if (opts.some(o => !o)) {
    errEl.textContent = 'সবগুলো অপশন পূরণ করুন।';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const correctIndex = state.editingOptions.findIndex(o => o.correct);
  const isEditing = !!state.editingQuestionId;

  let questionId;

  if (isEditing) {
    const { error: updateError } = await sb
      .from('questions')
      .update({ text, explanation: exp || null, correct_index: correctIndex })
      .eq('id', state.editingQuestionId);

    if (updateError) {
      errEl.textContent = 'প্রশ্ন আপডেট করতে সমস্যা হয়েছে: ' + updateError.message;
      errEl.style.display = 'block';
      return;
    }
    questionId = state.editingQuestionId;

    // পুরনো অপশনগুলো মুছে নতুন করে বসানো হচ্ছে, যাতে অপশনের সংখ্যা বদলালেও ঠিকভাবে কাজ করে
    const { error: delOptError } = await sb.from('options').delete().eq('question_id', questionId);
    if (delOptError) {
      errEl.textContent = 'পুরনো অপশন মুছতে সমস্যা হয়েছে: ' + delOptError.message;
      errEl.style.display = 'block';
      return;
    }
  } else {
    const { data: qData, error: qError } = await sb
      .from('questions')
      .insert({ exam_id: ex.id, text, explanation: exp || null, correct_index: correctIndex })
      .select()
      .single();

    if (qError) {
      errEl.textContent = 'প্রশ্ন যোগ করতে সমস্যা হয়েছে: ' + qError.message;
      errEl.style.display = 'block';
      return;
    }
    questionId = qData.id;
  }

  const optionRows = opts.map((text, i) => ({
    question_id: questionId,
    option_text: text,
    option_order: i
  }));
  const { error: oError } = await sb.from('options').insert(optionRows);
  if (oError) {
    errEl.textContent = 'অপশন সেভ করতে সমস্যা হয়েছে: ' + oError.message;
    errEl.style.display = 'block';
    return;
  }

  state.editingQuestionId = null;
  await loadAll();
  state.teacherView = 'examDetail';
  render();
}

async function deleteQuestion(id) {
  const { error } = await sb.from('questions').delete().eq('id', id);
  if (error) { alert('মুছতে সমস্যা হয়েছে: ' + error.message); return; }
  await loadAll();
  render();
}

function downloadQuestionPaper() {
  const ex = getExam(state.activeExamId);

  if (!ex || !r) return;

  let questionsHtml = '';
  ex.questions.forEach((q, qi) => {
    const given = r.answers[q.id];
    const isCorrect = given === q.correctIndex;

    let optionsHtml = '';
    q.options.forEach((opt, oi) => {
      const isCorrectOpt = oi === q.correctIndex;
      const isGivenOpt = oi === given;
      let marker = '';
      let style = '';
      if (isCorrectOpt) {
        marker = ' ✓';
        style = 'color:#2D6A4F; font-weight:700;';
      }
      if (isGivenOpt && !isCorrectOpt) {
        marker += ' (আপনার উত্তর ✗)';
        style = 'color:#B8471F; font-weight:700;';
      } else if (isGivenOpt && isCorrectOpt) {
        marker += ' (আপনার উত্তর)';
      }
      const letters = ['ক', 'খ', 'গ', 'ঘ', 'ঙ', 'চ'];
      optionsHtml += `<div class="opt-line" style="${style}">(${letters[oi] || (oi+1)}) ${esc(opt)}${marker}</div>`;
    });

    questionsHtml += `<div class="q-block">

      <div class="options">${optionsHtml}</div>

function renderStudent() {
  if (state.studentView === 'name') return renderStudentName();
  if (state.studentView === 'exam') return renderStudentExam();
  if (state.studentView === 'result') return renderStudentResult();
  if (state.studentView === 'history') return renderStudentHistory();
  return renderStudentExamList();
}

function renderStudentExamList() {
  if (state.exams.length === 0) {
    return '<div class="card"><div class="empty">এখনো কোনো পরীক্ষা তৈরি করা হয়নি। শিক্ষক ট্যাব থেকে পরীক্ষা তৈরি করুন।</div></div>';
  }
  let html = '';
  state.exams.forEach(ex => {
    const count = ex.questions.length;
    const windowCheck = checkExamWindow(ex);
    const windowStr = (ex.startsAt || ex.endsAt)
      ? ' · ⏰ ' + (ex.startsAt ? formatBnDateTime(new Date(ex.startsAt)) : 'যেকোনো সময়') + ' থেকে ' + (ex.endsAt ? formatBnDateTime(new Date(ex.endsAt)) : 'অসীম')
      : '';
    html += `<div class="exam-card">
      <div class="info">
        <div class="name">${esc(ex.title)}</div>
        <div class="meta">${count}টি প্রশ্ন${ex.durationMin ? ' · ' + ex.durationMin + ' মিনিট' : ''}${windowStr}</div>
      </div>
      <div class="actions">
        <button data-action="pick-exam" data-id="${ex.id}" ${(count === 0 || !windowCheck.ok) ? 'disabled' : ''}>পরীক্ষা দিন</button>
      </div>
    </div>`;
  });
  return html;
}

function checkExamWindow(ex) {
  const now = new Date();
  if (ex.startsAt && now < new Date(ex.startsAt)) {
    return { ok: false, message: `এই পরীক্ষাটি এখনো শুরু হয়নি। শুরু হবে: ${formatBnDateTime(new Date(ex.startsAt))}` };
  }
  if (ex.endsAt && now > new Date(ex.endsAt)) {
    return { ok: false, message: `এই পরীক্ষার সময় শেষ হয়ে গেছে। শেষ সময় ছিল: ${formatBnDateTime(new Date(ex.endsAt))}` };
  }
  return { ok: true };
}

function renderProgressChart(results) {
  if (results.length < 2) return '';

  // পুরনো থেকে নতুন ক্রমে সাজানো (চার্ট বাম থেকে ডানে সময় অনুযায়ী এগোবে)
  const chronological = results.slice().sort((a, b) => new Date(a.submittedAt) - new Date(b.submittedAt));
  const points = chronological.map(r => r.total > 0 ? Math.round((r.score / r.total) * 100) : 0);

  const W = 640, H = 180, padX = 30, padY = 24;
  const n = points.length;
  const stepX = n > 1 ? (W - padX * 2) / (n - 1) : 0;
  const maxVal = 100;

  const coords = points.map((p, i) => {
    const x = padX + i * stepX;
    const y = H - padY - (p / maxVal) * (H - padY * 2);
    return { x, y, p };
  });

  const linePath = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${coords[coords.length - 1].x.toFixed(1)},${H - padY} L${coords[0].x.toFixed(1)},${H - padY} Z`;

  const dots = coords.map((c, i) => `
    <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="5" fill="#6C4FF6" stroke="#fff" stroke-width="2"/>
    <text x="${c.x.toFixed(1)}" y="${(c.y - 12).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#5638E0">${toBnNumeral(c.p)}%</text>
  `).join('');

  const gridLines = [0, 25, 50, 75, 100].map(v => {
    const y = H - padY - (v / maxVal) * (H - padY * 2);
    return `<line x1="${padX}" y1="${y.toFixed(1)}" x2="${W - padX}" y2="${y.toFixed(1)}" stroke="#E7E1FA" stroke-width="1"/>`;
  }).join('');

  return `<div class="card" style="margin-bottom:16px;">
    <div class="toolbar" style="margin-bottom:10px;">
      <h2>স্কোরের ধারা</h2>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
      ${gridLines}
      <path d="${areaPath}" fill="#6C4FF6" opacity="0.08"/>
      <path d="${linePath}" fill="none" stroke="#6C4FF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div class="hint" style="margin-top:8px; text-align:center;">সবচেয়ে পুরনো পরীক্ষা বাম দিকে, সবচেয়ে সাম্প্রতিক ডান দিকে</div>
  </div>`;
}

  html += `<div class="card">

      <span class="badge">${toBnNumeral(myResults.length)}টি পরীক্ষা</span>
    </div>
  </div>`;

  if (myResults.length === 0) {
    html += '<div class="card"><div class="empty">এই নামে এখনো কোনো পরীক্ষা দেওয়া হয়নি।</div></div>';
    return html;
  }

  const avgPct = Math.round(
    myResults.reduce((sum, r) => sum + (r.total > 0 ? (r.score / r.total) * 100 : 0), 0) / myResults.length
  );
  html += `<div class="score-box" style="margin-bottom: 16px;">
    <div class="num">${toBnNumeral(avgPct)}%</div>
    <div class="lbl">গড় স্কোর (${toBnNumeral(myResults.length)}টি পরীক্ষার ভিত্তিতে)</div>
  </div>`;

  html += renderProgressChart(myResults);

  myResults.forEach(r => {
    const ex = getExam(r.examId);
    const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
    html += `<div class="exam-card">
      <div class="info">
        <div class="name">${esc(ex ? ex.title : 'মুছে ফেলা পরীক্ষা')}</div>
        <div class="meta">${formatBnDateTime(new Date(r.submittedAt))}</div>
      </div>
      <div class="actions">
        <span class="badge" style="margin-left:0;">${toBnNumeral(r.score)}/${toBnNumeral(r.total)} · ${toBnNumeral(pct)}%</span>
      </div>
    </div>`;
  });

  return html;
}

function renderLeaderboard(examId, currentResult) {
  const examResults = state.results
    .filter(res => res.examId === examId)
    .slice()
    .sort((a, b) => {
      if (b.score !== a.score) return b.score - a.score;
      return new Date(a.submittedAt) - new Date(b.submittedAt);
    });

  if (examResults.length === 0) return '';

  let rows = '';
  examResults.forEach((res, i) => {
    const isMe = res.id === currentResult.id;
    const pct = res.total > 0 ? Math.round((res.score / res.total) * 100) : 0;
    rows += `<div class="lb-row ${isMe ? 'lb-me' : ''}">
      <span class="lb-rank">${toBnNumeral(i + 1)}</span>
      <span class="lb-name">${esc(res.studentName)}${isMe ? ' (আপনি)' : ''}</span>
      <span class="lb-score">${toBnNumeral(res.score)}/${toBnNumeral(res.total)} · ${toBnNumeral(pct)}%</span>
    </div>`;
  });

  return `<div class="card" style="margin-top:16px;">
    <div class="toolbar" style="margin-bottom:12px;">
      <h2>🏆 লিডারবোর্ড</h2>
      <span class="badge">${toBnNumeral(examResults.length)} জন</span>
    </div>
    ${rows}
  </div>`;
}

function bindStudentEvents() {
  const container = document.getElementById('content');

  container.querySelectorAll('[data-action="pick-exam"]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeExamId = btn.dataset.id;
      state.studentView = 'name';
      render();
    });
  });

  const backToList = container.querySelector('[data-action="back-to-list"]');
  if (backToList) backToList.addEventListener('click', () => { state.studentView = 'list'; render(); });

  const backToListResult = container.querySelector('[data-action="back-to-list-from-result"]');
  if (backToListResult) backToListResult.addEventListener('click', async () => {
    stopTimer();
    state.studentView = 'list';
    state.activeExamId = null;
    await loadAll();
    render();
  });

  const startBtn = container.querySelector('[data-action="start-exam"]');
  if (startBtn) startBtn.addEventListener('click', startExam);

  container.querySelectorAll('[data-action="select-answer"]').forEach(el => {
    el.addEventListener('change', () => selectAnswer(el.dataset.qid, parseInt(el.dataset.oi, 10)));
  });

  const submitBtn = container.querySelector('[data-action="submit-exam"]');
  if (submitBtn) submitBtn.addEventListener('click', () => submitExam(false));

  const downloadBtn = container.querySelector('[data-action="download-question-paper"]');
  if (downloadBtn) downloadBtn.addEventListener('click', downloadQuestionPaper);

  const historyBtn = container.querySelector('[data-action="view-my-history"]');
  if (historyBtn) historyBtn.addEventListener('click', () => {
    state.historyStudentName = historyBtn.dataset.name;
    state.studentView = 'history';
    render();
  });

  const backFromHistory = container.querySelector('[data-action="back-from-history"]');
  if (backFromHistory) backFromHistory.addEventListener('click', () => {
    state.studentView = 'result';
    render();
  });

  if (state.studentView === 'exam') startTimerIfNeeded();
}

async function startExam() {
  const ex = getExam(state.activeExamId);
  if (!ex) return;
  const errEl = document.getElementById('nameErr');

  const windowCheck = checkExamWindow(ex);
  if (!windowCheck.ok) {
    errEl.textContent = windowCheck.message;
    errEl.style.display = 'block';
    return;
  }

  const nameInput = document.getElementById('studentNameInput');
  const phoneInput = document.getElementById('studentPhoneInput');
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();

  if (!name) {
    errEl.textContent = 'অনুগ্রহ করে আপনার নাম লিখুন।';
    errEl.style.display = 'block';
    return;
  }
  if (!phone) {
    errEl.textContent = 'অনুগ্রহ করে আপনার মোবাইল নাম্বার লিখুন।';
    errEl.style.display = 'block';
    return;
  }
  const digitsOnly = phone.replace(/\D/g, '');
  if (digitsOnly.length < 10) {
    errEl.textContent = 'সঠিক মোবাইল নাম্বার লিখুন।';
    errEl.style.display = 'block';
    return;
  }

  const { data: existing, error } = await sb
    .from('results')
    .select('*')
    .eq('exam_id', ex.id)
    .eq('student_phone', digitsOnly)
    .order('submitted_at', { ascending: false })
    .limit(1);

  if (error) {
    errEl.textContent = 'যাচাই করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।';
    errEl.style.display = 'block';
    return;
  }

  if (existing && existing.length > 0) {
    // আগেই এই পরীক্ষা দেওয়া হয়েছে — নতুন করে না দিয়ে আগের ফলাফল সরাসরি দেখানো হচ্ছে
    const prev = existing[0];
    state.studentName = prev.student_name;
    state.studentPhone = prev.student_phone;
    state.lastResult = {
      id: prev.id, examId: prev.exam_id, studentName: prev.student_name,
      studentPhone: prev.student_phone, score: prev.score, total: prev.total,
      answers: prev.answers, submittedAt: prev.submitted_at
    };
    state.studentView = 'result';
    render();
    return;
  }

  state.studentName = name;
  state.studentPhone = digitsOnly;
  state.answers = {};
  state.studentView = 'exam';
  render();
}

function selectAnswer(qId, oi) {
  state.answers[qId] = oi;
  render();
}

function startTimerIfNeeded() {
  stopTimer();
  const ex = getExam(state.activeExamId);
  if (!ex || !ex.durationMin) return;

  if (state.timeLeftSec === null) {
    state.timeLeftSec = ex.durationMin * 60;
  }
  updateTimerDisplay();

  state.timerInterval = setInterval(() => {
    state.timeLeftSec--;
    if (state.timeLeftSec <= 0) {
      stopTimer();
      submitExam(true);
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const box = document.getElementById('timerBox');
  if (!box) return;
  const m = Math.floor(state.timeLeftSec / 60);
  const s = state.timeLeftSec % 60;
  box.textContent = `সময় বাকি: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  box.classList.toggle('low', state.timeLeftSec <= 30);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
  state.timeLeftSec = null;
}

async function submitExam(autoSubmitted) {
  const ex = getExam(state.activeExamId);
  if (!ex) return;

  if (!autoSubmitted) {
    const unanswered = ex.questions.filter(q => state.answers[q.id] === undefined);
    const errEl = document.getElementById('examErr');
    if (unanswered.length > 0) {
      errEl.textContent = `${unanswered.length}টি প্রশ্নের উত্তর দেওয়া বাকি আছে।`;
      errEl.style.display = 'block';
      return;
    }
  }

  stopTimer();

  let score = 0;
  ex.questions.forEach(q => {
    if (state.answers[q.id] === q.correctIndex) score++;
  });

  const answersToSave = {...state.answers};

  const { data, error } = await sb
    .from('results')
    .insert({
      exam_id: ex.id,
      student_name: state.studentName,
      student_phone: state.studentPhone,
      score, total: ex.questions.length,
      answers: answersToSave
    })
    .select()
    .single();

  if (error) {
    alert('রেজাল্ট সেভ করতে সমস্যা হয়েছে: ' + error.message);
    return;
  }

  state.lastResult = {
    id: data.id, examId: ex.id, studentName: state.studentName, studentPhone: state.studentPhone,
    score, total: ex.questions.length, answers: answersToSave, submittedAt: data.submitted_at
  };
  state.results.unshift(state.lastResult);
  state.studentView = 'result';
  render();
}

document.getElementById('mainTabStudent').addEventListener('click', () => switchTab('student'));
document.getElementById('mainTabTeacher').addEventListener('click', () => switchTab('teacher'));

// URL এ ?exam=xxxx থাকলে সরাসরি সেই পরীক্ষায় নিয়ে যাওয়া, লিংক-নির্দিষ্ট মোড চালু রাখা
const urlParams = new URLSearchParams(window.location.search);
const linkedExamId = urlParams.get('exam');
if (linkedExamId) {
  state.lockedExamId = linkedExamId;
  state.activeExamId = linkedExamId;
  state.studentView = 'name';
  // এই মোডে শিক্ষার্থীদের জন্য শিক্ষক ট্যাব লুকানো হবে
  document.getElementById('mainTabTeacher').style.display = 'none';
}

loadAll();
</script>
